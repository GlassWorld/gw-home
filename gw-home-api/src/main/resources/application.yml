spring:
  config:
    import:
      - optional:file:.env.local[.properties]
      - optional:file:../.env.local[.properties]
  profiles:
    active: local
  security:
    user:
      name: dev-user
      password: dev-password

jwt:
  secret: Z3ctaG9tZS1kZWZhdWx0LXNlY3JldC1rZXktZm9yLWRldmVsb3BtZW50LWFuZC10ZXN0aW5nLTEyMw==
  access-token-expiration-seconds: 10800
  refresh-token-expiration-seconds: 1814400
  otp-temp-token-expiration-seconds: 300

otp:
  encryption-key: Z3ctaG9tZS1vdHAta2V5IQ==

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}

work:
  notifications:
    enabled: ${WORK_NOTIFICATIONS_ENABLED:false}
    smtp-auth-mode: ${WORK_SMTP_AUTH_MODE:PASSWORD}
    smtp-host: ${WORK_SMTP_HOST:}
    smtp-port: ${WORK_SMTP_PORT:587}
    smtp-username: ${WORK_SMTP_USERNAME:}
    smtp-password: ${WORK_SMTP_PASSWORD:}
    starttls: ${WORK_SMTP_STARTTLS:true}
    ssl: ${WORK_SMTP_SSL:false}
    from: ${WORK_MAIL_FROM:}
    from-name: ${WORK_MAIL_FROM_NAME:}
    app-url: ${WORK_MAIL_APP_URL:}
    microsoft-tenant-id: ${WORK_M365_TENANT_ID:}
    microsoft-client-id: ${WORK_M365_CLIENT_ID:}
    microsoft-client-secret: ${WORK_M365_CLIENT_SECRET:}
    poll-delay-ms: ${WORK_MAIL_POLL_DELAY_MS:30000}
  git:
    encryption-key: Z3ctaG9tZS1naXQta2V5IQ==

server:
  port: 8080
